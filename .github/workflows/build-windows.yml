# Windows 用のインストーラーとポータブル版（.exe）を作る
# - ブランチに push するたびに作り、Actions の「Artifacts」から取り出せる
# - いつものブランチ（default branch）で package.json のバージョンが新しくなったら、
#   そのバージョン（例: v1.1.0）でタグを作って Releases に載せる（同じバージョンのリリースがあれば何もしない）
# - Actions の画面の「Run workflow」や、v で始まるタグの push でも載せられる
# - リリースの説明は docs/release-notes/v（バージョン）.md があればそれを使う
name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Releases に載せる（package.json のバージョンでタグを作る）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer and portable exe
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Pomoroad-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Prepare release
        id: rel
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.release) ||
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "v$v はもうリリース済みなので何もしない"
            exit 0
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          notes="docs/release-notes/v$v.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            echo "Pomoroad $v" > "$notes"
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.rel.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pomoroad ${{ steps.rel.outputs.version }}
          body_path: ${{ steps.rel.outputs.notes }}
          files: dist/*.exe
