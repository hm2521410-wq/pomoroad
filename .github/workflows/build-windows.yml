# Windows 用のインストーラーとポータブル版（.exe）を作る
# - ブランチに push するたびに作り、Actions の「Artifacts」から取り出せる
# - v で始まるタグ（例: v1.0.0）を push すると Releases にも載せる
name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer and portable exe
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Pomoroad-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
